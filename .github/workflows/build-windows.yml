name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  EGLANTINE_VERSION: v0.1.0-rc3
  EGLANTINE_WINDOWS_URL: https://github.com/Eglantine-Community/Eglantine/releases/download/v0.1.0-rc3/eglantine-windows-x86_64.zip
  EGLANTINE_WINDOWS_SHA256: b464901d3f0cdaf1dcee0a11bd9e147a6f0c4d875b783034daf70442ef9dc76b

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone launcher
        shell: pwsh
        run: |
          dotnet publish src/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if (!(Test-Path "publish/NintendoSwitch2Emulator.exe")) {
            throw "No se ha generado NintendoSwitch2Emulator.exe"
          }

      - name: Download and verify Eglantine Windows engine
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "eglantine-windows.zip"
          Invoke-WebRequest -Uri $env:EGLANTINE_WINDOWS_URL -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EGLANTINE_WINDOWS_SHA256) {
            throw "El SHA-256 del motor Eglantine no coincide. Descarga cancelada."
          }
          $extract = Join-Path $env:RUNNER_TEMP "eglantine-engine"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Path "dist/engine" -Force | Out-Null
          Get-ChildItem -Path $extract -Force | Copy-Item -Destination "dist/engine" -Recurse -Force
          $engine = Get-ChildItem -Path "dist/engine" -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -in @("eglantine.exe", "Eglantine.exe", "eden.exe", "Eden.exe") } |
            Select-Object -First 1
          if ($null -eq $engine) {
            throw "No se ha encontrado el ejecutable de Eglantine dentro del paquete de Windows."
          }
          Write-Host "Motor encontrado: $($engine.FullName)"

      - name: Include launcher and third-party notices
        shell: pwsh
        run: |
          Copy-Item "publish/NintendoSwitch2Emulator.exe" "dist/NintendoSwitch2Emulator.exe"
          Copy-Item "README.md" "dist/LEEME.md"
          Copy-Item "LICENSE" "dist/LICENSE-LAUNCHER.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist/AVISOS-TERCEROS.txt"
          New-Item -ItemType Directory -Path "dist/licenses" -Force | Out-Null
          $sourceZip = Join-Path $env:RUNNER_TEMP "eglantine-source.zip"
          $sourceUrl = "https://github.com/Eglantine-Community/Eglantine/archive/refs/tags/$env:EGLANTINE_VERSION.zip"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $sourceZip
          Copy-Item $sourceZip "dist/licenses/Eglantine-source-$env:EGLANTINE_VERSION.zip"

      - name: Create Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "Switch2PC-Windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Switch2PC-Windows-x64
          path: Switch2PC-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Switch2PC-Windows-x64.zip
          generate_release_notes: true
